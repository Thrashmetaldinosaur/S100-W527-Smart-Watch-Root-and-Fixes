plugins { id 'com.android.application' }
android {
    namespace 'com.s100.cameraflip'
    compileSdk 35
    defaultConfig {
        applicationId 'com.s100.cameraflip'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '1.0-test1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false }; debug { minifyEnabled false } }
}
dependencies { compileOnly files('libs/api-82.jar') }
